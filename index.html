<style>
/* Layout: clinic incident log — cool mint-grey ground, white panels, deep-teal actions; left rail on desktop, bottom tabs on phones.
   Severity is the page's one loud signal: a colored stripe on every record. */
:root {
  --bg: #f1f5f4; --surface: #ffffff; --sunk: #f6f9f8; --ink: #14211f; --muted: #5a6b68; --line: #dbe5e2;
  --accent: #0b7a72; --accent-deep: #075e58; --accent-soft: #dcf1ee; --accent-line: #a7d8d1; --accent-ink: #ffffff;
  --red: #b93228; --red-soft: #fbe3e0; --amber: #9a5f00; --amber-soft: #fff1d1; --green: #1d8350; --green-soft: #dcf2e5;
  --sev1: #7d9893; --sev2: #e0a100; --sev3: #e06a28; --sev4: #c4302b;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c-other: #a9b7b4;
  --grid: #e6eeec;
  --shadow: 0 1px 2px rgba(10, 50, 45, .05), 0 6px 22px rgba(10, 50, 45, .06);
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Sarabun", "Leelawadee UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1615; --surface: #15201f; --sunk: #111b1a; --ink: #e5efed; --muted: #98aeaa; --line: #263634;
  --accent: #3cbfb2; --accent-deep: #84ddd3; --accent-soft: #12393a; --accent-line: #22625c; --accent-ink: #03201d;
  --red: #f08378; --red-soft: #45201c; --amber: #f0b44c; --amber-soft: #3a2c10; --green: #66c995; --green-soft: #15321f;
  --sev1: #8aa6a1; --sev2: #d39c16; --sev3: #e27c3f; --sev4: #e5524d;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c-other: #55686a;
  --grid: #1f2d2b;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #15201f; --sunk: #111b1a; --ink: #e5efed; --muted: #98aeaa; --line: #263634;
  --accent: #3cbfb2; --accent-deep: #84ddd3; --accent-soft: #12393a; --accent-line: #22625c; --accent-ink: #03201d;
  --red: #f08378; --red-soft: #45201c; --amber: #f0b44c; --amber-soft: #3a2c10; --green: #66c995; --green-soft: #15321f;
  --sev1: #8aa6a1; --sev2: #d39c16; --sev3: #e27c3f; --sev4: #e5524d;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c-other: #55686a;
  --grid: #1f2d2b;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-size: 1.55rem; font-weight: 700; } h2 { font-size: 1.12rem; font-weight: 600; } h3 { font-size: .98rem; font-weight: 600; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: .01em; }
.muted { color: var(--muted); } .small { font-size: .84rem; } .num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(145deg, #ffc4d6, #f58bb0); display: grid; place-items: center; flex: none; }
.mark svg { width: 80%; height: 80%; }
.tsel { display: flex; gap: 6px; align-items: center; }
.tsel .i { flex: 1; }
.tsel b { color: var(--muted); }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 1rem; white-space: nowrap; line-height: 1.2; color: var(--accent-deep); }
.brand-s { font-size: .76rem; color: var(--muted); line-height: 1.3; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid transparent; background: none; border-radius: 12px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; position: relative; }
.nav button svg { width: 19px; height: 19px; flex: none; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-line); font-weight: 600; }
.nav .badge { margin-left: auto; background: var(--red); color: #fff; font-size: .7rem; padding: 0 7px; border-radius: 999px; line-height: 1.7; font-variant-numeric: tabular-nums; }
.me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; display: grid; gap: 8px; font-size: .85rem; }
.me .row { display: flex; gap: 6px; flex-wrap: wrap; }
.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; display: grid; gap: 16px; }
.wrap.narrow { max-width: 760px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mob-top { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: auto 0 0 0; height: auto; flex-direction: row; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); border-right: 0; border-top: 1px solid var(--line); z-index: 20; }
  .rail .brand, .rail .me { display: none; }
  .nav { grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .nav button { flex-direction: column; gap: 1px; font-size: .7rem; padding: 6px 2px; justify-content: center; text-align: center; }
  .nav .badge { position: absolute; top: 0; left: calc(50% + 6px); right: auto; margin: 0; }
  .main { padding-block: 0 100px; }
  .mob-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
}

/* ---------- elements ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.ptitle { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--accent-line); color: var(--accent-deep); background: var(--surface); padding: 9px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.07); }
.btn.dng { color: var(--red); border-color: var(--red-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.sm { padding: 4px 10px; font-size: .84rem; border-radius: 10px; }
.btn.big { padding: 13px 22px; font-size: 1.02rem; }
.btn:disabled { opacity: .55; cursor: progress; }
label.f { display: grid; gap: 5px; font-size: .86rem; font-weight: 500; min-width: 0; }
label.f > span em, .lab em { color: var(--red); font-style: normal; }
.lab { font-size: .86rem; font-weight: 500; }
.i { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 12px; padding: 9px 11px; font-size: .96rem; font-weight: 400; min-width: 0; }
textarea.i { resize: vertical; min-height: 120px; line-height: 1.6; }
.i:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.span2 { grid-column: 1 / -1; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: .8rem; color: var(--muted); font-weight: 400; }
.err { color: var(--red); font-size: .88rem; min-height: 1em; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent-line); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "✓"; font-size: .8em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 13px; cursor: pointer; display: grid; gap: 2px; }
.tile b { font-weight: 600; font-size: .95rem; }
.tile span { font-size: .78rem; color: var(--muted); line-height: 1.4; }
.tile:hover { border-color: var(--accent-line); }
.tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.tile[aria-pressed="true"] b { color: var(--accent-deep); }
.sevtile { border-left-width: 6px; }
.sevtile[data-sev="1"] { border-left-color: var(--sev1); } .sevtile[data-sev="2"] { border-left-color: var(--sev2); }
.sevtile[data-sev="3"] { border-left-color: var(--sev3); } .sevtile[data-sev="4"] { border-left-color: var(--sev4); }
.sevtile[aria-pressed="true"] { border-left-width: 6px; }

/* report form */
.rsec { display: grid; gap: 14px; }
.rsec + .rsec { border-top: 1px dashed var(--line); padding-top: 18px; }
.rsec-h { display: flex; gap: 10px; align-items: baseline; }
.rsec-h .n { font-family: var(--f-mono); font-size: .78rem; color: var(--accent); border: 1px solid var(--accent-line); border-radius: 6px; padding: 0 6px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 84px; height: 84px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--line); background: var(--sunk); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
.addph { width: 84px; height: 84px; border-radius: 12px; border: 1.5px dashed var(--accent-line); display: grid; place-items: center; color: var(--accent-deep); cursor: pointer; font-size: .75rem; text-align: center; background: var(--surface); }
.addph svg { width: 22px; height: 22px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.done { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 28px; }
.done .big-id { font-family: var(--f-mono); font-size: 1.6rem; color: var(--accent-deep); background: var(--accent-soft); padding: 6px 16px; border-radius: 12px; }
.done .ok { width: 58px; height: 58px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
.done .ok svg { width: 30px; height: 30px; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.7; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-new { background: var(--red-soft); color: var(--red); }
.st-work { background: var(--amber-soft); color: var(--amber); }
.st-done { background: var(--green-soft); color: var(--green); }
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.sev i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; color: #fff; font-style: normal; font-family: var(--f-mono); font-size: .74rem; }
.sev[data-sev="1"] i { background: var(--sev1); } .sev[data-sev="2"] i { background: var(--sev2); color: #2a1d00; }
.sev[data-sev="3"] i { background: var(--sev3); } .sev[data-sev="4"] i { background: var(--sev4); }
.tag { font-size: .76rem; border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; color: var(--muted); white-space: nowrap; }
.lock { font-size: .74rem; color: var(--amber); font-weight: 600; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; text-align: left; cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.kpi:hover { border-color: var(--accent-line); }
.kpi .l { font-size: .82rem; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: .78rem; color: var(--muted); }
.kpi.alert .v { color: var(--red); }
.kpi.warn .v { color: var(--sev3); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 9px; cursor: pointer; font-size: .86rem; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.dgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 980px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } }

/* charts */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.cols { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 6px; }
.yax { position: relative; height: 200px; margin-top: 20px; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.yax span { position: absolute; right: 0; transform: translateY(50%); }
.plot { position: relative; height: 200px; margin-top: 20px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; align-items: end; border-bottom: 1px solid var(--muted); }
.plot .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); pointer-events: none; }
.col { position: relative; display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; justify-content: flex-start; cursor: pointer; z-index: 1; }
.col .seg-b { flex-shrink: 0; width: min(100%, 44px); margin: 0 auto; border-radius: 0; }
.col .seg-b:last-child { border-radius: 4px 4px 0 0; }
.col .tot { text-align: center; font-size: .74rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.col:hover .seg-b { filter: brightness(1.08); }
.xax { grid-column: 2; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; font-size: .74rem; color: var(--muted); text-align: center; padding-top: 6px; }
.hb { display: grid; gap: 6px; }
.hb-r { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr) 2.6em; gap: 10px; align-items: center; font-size: .86rem; cursor: pointer; border-radius: 8px; padding: 2px 4px; }
.hb-r:hover { background: var(--sunk); }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hb-t { height: 14px; background: var(--sunk); border-radius: 0 4px 4px 0; position: relative; }
.hb-b { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 110px; align-items: end; border-bottom: 1px solid var(--muted); }
.hours div { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 0; cursor: default; }
.hours div.z { background: transparent; }
.hlab { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); font-size: .72rem; color: var(--muted); padding-top: 4px; }
.sevbar { display: flex; gap: 2px; height: 26px; border-radius: 6px; overflow: hidden; }
.sevbar div { min-width: 3px; cursor: pointer; }
.sevleg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin-top: 12px; }
.sevleg button { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .86rem; padding: 2px 4px; border-radius: 6px; }
.sevleg button:hover { background: var(--sunk); }
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; padding: 6px 10px; border-radius: 8px; max-width: 260px; line-height: 1.45; box-shadow: var(--shadow); }
.empty { padding: 26px 10px; text-align: center; color: var(--muted); font-size: .9rem; }

/* list */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filters .q { grid-column: 1 / -1; } }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 6px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; width: 100%; }
.item:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
.item .stripe[data-sev="1"] { background: var(--sev1); } .item .stripe[data-sev="2"] { background: var(--sev2); }
.item .stripe[data-sev="3"] { background: var(--sev3); } .item .stripe[data-sev="4"] { background: var(--sev4); }
.item .body { padding: 11px 14px; display: grid; gap: 4px; min-width: 0; }
.item .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.item .top .id { color: var(--ink); font-weight: 500; }
.item .top .grow { flex: 1; }
.item .t { font-weight: 600; font-size: .95rem; }

      var p = { type: qs('#eTy', m).value, category: qs('#eCa', m).value, severity: +qs('#eSv', m).value, incidentDate: qs('#eDt', m).value, incidentTime: timeVal('e', m) || (/^\d{2}:\d{2}$/.test(r.incidentTime) ? '' : r.incidentTime),
        location: qs('#eLo', m).value, petRef: qs('#ePe', m).value, claim: qs('#eCl', m).value.replace(/[^\d.]/g, '') || 0, owner: qs('#eOw', m).value, departments: depts, confidential: qs('#eCf', m).checked };
      if (state.user.role !== 'branch') p.branch = qs('#eBr', m).value;
      busy(qs('[type=submit]', m), authed('updateIncident', r.id, p)).then(function (nr) { replaceRow(nr); m.remove(); toast('บันทึกแล้ว'); go('detail', r.id, true); });
    };
  }

  // ---------- settings ----------
  function viewSettings(el) {
    el.innerHTML = '<div class="panel sk"><i></i><i></i><i></i></div>';
    Promise.all([authed('getSettings'), authed('listUsers')]).then(function (res) { drawSettings(el, res[0], res[1]); }, function (e) { el.innerHTML = '<div class="panel err">' + esc(e.message) + '</div>'; });
  }
  function drawSettings(el, s, users) {
    var c = state.config;
    function lines(a) { return esc((a || []).join('\n')); }
    el.innerHTML = '<div class="head"><h1>ตั้งค่า</h1></div>' +
      '<section class="panel"><div class="ptitle"><h2>ผู้ใช้งาน</h2><button class="btn sm pri" type="button" id="uAdd">เพิ่มผู้ใช้</button></div><div class="scroll"><table class="tbl"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>บทบาท</th><th>สาขา</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
      users.map(function (u, i) { return '<tr><td class="mono">' + esc(u.username) + '</td><td>' + esc(u.name) + '</td><td>' + esc(ROLES[u.role] || u.role) + '</td><td>' + esc(u.branch ? branchName(u.branch) : 'ทุกสาขา') + '</td><td>' + (u.active ? 'ใช้งาน' : '<span class="muted">ปิด</span>') + '</td><td><button class="btn sm" type="button" data-u="' + i + '">แก้ไข</button></td></tr>'; }).join('') +
      '</tbody></table></div><div class="hint" style="margin-top:8px">ผู้บริหาร / QA เห็นและติดตามได้ทุกสาขา · หัวหน้าสาขาเห็นเฉพาะสาขาตัวเอง (เรื่องความลับจะซ่อนชื่อผู้แจ้ง) · พนักงานทั่วไปแจ้งเหตุได้โดยไม่ต้องมีบัญชี</div></section>' +
      '<section class="panel stack"><h2>ตัวเลือกในฟอร์ม</h2><div class="grid2">' +
      '<label class="f"><span>ชื่อองค์กร</span><input class="i" id="sOrg" value="' + esc(s.orgName) + '"></label>' +
      '<label class="f"><span>สาขา <span class="hint">บรรทัดละสาขา รูปแบบ รหัส=ชื่อ</span></span><textarea class="i" id="sBr" rows="4">' + esc((s.branches || []).map(function (b) { return b.code + '=' + b.name; }).join('\n')) + '</textarea></label>' +
      '<label class="f"><span>ประเภท <span class="hint">5 ประเภทแรกมีสีในกราฟ</span></span><textarea class="i" id="sTy" rows="6">' + lines(s.types) + '</textarea></label>' +
      '<label class="f"><span>หมวดปัญหา</span><textarea class="i" id="sCa" rows="6">' + lines(s.categories) + '</textarea></label>' +
      '<label class="f"><span>แผนก</span><textarea class="i" id="sDe" rows="6">' + lines(s.departments) + '</textarea></label>' +
      '<label class="f"><span>สถานที่ (คำแนะนำ)</span><textarea class="i" id="sLo" rows="6">' + lines(s.locations) + '</textarea></label>' +
      '<label class="f"><span>รหัสแจ้งเหตุ <span class="hint">เว้นว่าง = ใครมีลิงก์ก็แจ้งได้</span></span><input class="i" id="sPin" value="' + esc(s.reportPin || '') + '"></label>' +
      '<label class="f"><span>ลิงก์หน้าเว็บนี้ <span class="hint">ใช้แนบในข้อความ LINE</span></span><input class="i" id="sUrl" placeholder="https://…/incident/" value="' + esc(s.appUrl || '') + '"></label>' +
      '</div></section>' +
      '<section class="panel stack"><h2>แจ้งเตือน LINE</h2><div class="hint">1) ใส่ Channel access token แล้วกดบันทึก · 2) เชิญบอทเข้ากลุ่ม LINE ระบบจะรู้จักกลุ่มเองและตอบในกลุ่มว่าเชื่อมแล้ว (ถ้าบอทอยู่ในกลุ่มก่อนแล้ว พิมพ์ในกลุ่มว่า <b>ตั้งกลุ่มแจ้งเตือน</b>)' + (s.webAppUrl ? '<br>Webhook URL สำหรับ LINE Developers: <span class="mono" style="user-select:all;overflow-wrap:anywhere">' + esc(s.webAppUrl) + '</span>' : '') + '</div><div class="grid3">' +
      '<label class="f"><span>Channel access token</span><input class="i" id="sTok" type="password" placeholder="' + (s.lineTokenSet ? 'ตั้งค่าแล้ว · กรอกเพื่อเปลี่ยน' : 'ยังไม่ได้ตั้งค่า') + '"></label>' +
      '<label class="f"><span>กลุ่มที่รับแจ้งเตือน</span><select class="i" id="sTo"><option value="">— ยังไม่ได้เลือก —</option>' + (s.lineGroups || []).concat(s.lineTo && !(s.lineGroups || []).some(function (g) { return g.id === s.lineTo; }) ? [{ id: s.lineTo, name: 'กลุ่มที่ตั้งไว้ (' + s.lineTo.slice(0, 8) + '…)' }] : []).map(function (g) { return '<option value="' + esc(g.id) + '"' + (g.id === s.lineTo ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="f"><span>แจ้งเตือนเมื่อระดับตั้งแต่</span><select class="i" id="sMin">' + SEV.map(function (x) { return '<option value="' + x.v + '"' + (+s.notifyMinSeverity === x.v ? ' selected' : '') + '>ระดับ ' + x.v + ' ขึ้นไป</option>'; }).join('') + '</select></label>' +
      '</div><div class="row"><button class="btn" type="button" id="sTest">ส่งข้อความทดสอบ</button></div></section>' +
      '<section class="panel stack"><h2>ข้อมูลจาก Google Form เดิม</h2><div class="grid2"><label class="f"><span>ชื่อชีตคำตอบเดิม</span><input class="i" id="sLeg" value="' + esc(s.legacySheet || '') + '"></label></div>' +
      '<div class="row"><button class="btn" type="button" id="sImp">ดึงข้อมูลที่ยังไม่ได้ดึง</button><span class="hint">ดึงซ้ำได้ ระบบข้ามแถวที่เคยดึงแล้ว</span></div></section>' +
      '<div class="row"><button class="btn pri big" type="button" id="sSave">บันทึกการตั้งค่า</button>' + (!LIVE ? '<button class="btn dng" type="button" id="sReset">รีเซ็ตข้อมูลตัวอย่าง</button>' : '') + '</div>';
    function arr(id) { return qs(id, el).value.split('\n').map(function (x) { return x.trim(); }).filter(String); }
    qs('#sSave', el).onclick = function () {
      var p = { orgName: qs('#sOrg', el).value.trim(), branches: arr('#sBr').map(function (l) { var k = l.split('='); return { code: k[0].trim().toUpperCase(), name: (k[1] || k[0]).trim() }; }),
        types: arr('#sTy'), categories: arr('#sCa'), departments: arr('#sDe'), locations: arr('#sLo'), reportPin: qs('#sPin', el).value.trim(),
        appUrl: qs('#sUrl', el).value.trim(), lineTo: qs('#sTo', el).value, notifyMinSeverity: +qs('#sMin', el).value, legacySheet: qs('#sLeg', el).value.trim() };
      var tok = qs('#sTok', el).value.trim(); if (tok) p.lineToken = tok;
      busy(qs('#sSave', el), authed('saveSettings', p)).then(function () { toast('บันทึกการตั้งค่าแล้ว'); return call('bootstrap', state.token); }).then(function (b) { state.config = b.config; store('ir_config', JSON.stringify(b.config)); renderShell(); go('settings'); });
    };
    qs('#sTest', el).onclick = function () { busy(qs('#sTest', el), authed('testNotify')).then(function () { toast('ส่งข้อความทดสอบแล้ว'); }); };
    qs('#sImp', el).onclick = function () { busy(qs('#sImp', el), authed('importLegacy')).then(function (r) { toast(r.note || ('ดึงข้อมูลใหม่ ' + r.imported + ' เรื่อง · ข้าม ' + r.skipped + ' เรื่อง')); loadRows(); }); };
    if (qs('#sReset', el)) qs('#sReset', el).onclick = function () { confirmBox('รีเซ็ตข้อมูลตัวอย่างกลับเป็น 46 เรื่องจากชีตเดิม?', 'รีเซ็ต', function () { Demo._reset(); logout(); toast('รีเซ็ตแล้ว'); }); };
    qs('#uAdd', el).onclick = function () { editUser(null); };
    qsa('[data-u]', el).forEach(function (b) { b.onclick = function () { editUser(users[+b.dataset.u]); }; });
    function editUser(u) {
      var n = !u; u = u || { username: '', name: '', role: 'branch', branch: c.branches[0] && c.branches[0].code, active: true };
      var m = modal('<h2>' + (n ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้ ' + esc(u.username)) + '</h2><form class="stack" id="uF">' +
        '<label class="f"><span>ชื่อผู้ใช้</span><input class="i mono" id="uU" value="' + esc(u.username) + '"' + (n ? '' : ' readonly') + ' autocapitalize="off"></label>' +
        '<label class="f"><span>ชื่อที่แสดง</span><input class="i" id="uN" value="' + esc(u.name) + '"></label>' +
        '<div class="grid2"><label class="f"><span>บทบาท</span><select class="i" id="uR">' + Object.keys(ROLES).map(function (k) { return '<option value="' + k + '"' + (u.role === k ? ' selected' : '') + '>' + ROLES[k] + '</option>'; }).join('') + '</select></label>' +
        '<label class="f"><span>สาขา (หัวหน้าสาขา)</span><select class="i" id="uB">' + opts(c.branches, u.branch, '-') + '</select></label></div>' +
        '<label class="f"><span>' + (n ? 'รหัสผ่าน' : 'รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)') + '</span><input class="i" id="uP" type="password" autocomplete="new-password"></label>' +
        '<label class="check"><input type="checkbox" id="uA"' + (u.active ? ' checked' : '') + '><span>เปิดใช้งาน</span></label>' +
        '<div class="row"><button class="btn pri" type="submit">บันทึก</button><button class="btn ghost" type="button" data-close>ยกเลิก</button></div></form>');
      qs('#uF', m).onsubmit = function (e) {
        e.preventDefault();
        busy(qs('[type=submit]', m), authed('saveUser', { username: qs('#uU', m).value, name: qs('#uN', m).value, role: qs('#uR', m).value, branch: qs('#uB', m).value, password: qs('#uP', m).value, active: qs('#uA', m).checked }))
          .then(function () { m.remove(); toast('บันทึกผู้ใช้แล้ว'); viewSettings(el); });
      };
    }
  }

  // ---------- auto refresh ----------
  setInterval(function () {
    if (!state.user || document.visibilityState !== 'visible' || document.querySelector('.modal')) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (state.view === 'dash' || state.view === 'list') loadRows().catch(function () { });
  }, 90000);
  window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });

  // ---------- boot ----------
  function boot() {
    renderShell();
    var hh = decodeURIComponent(location.hash.slice(1));
    var saved = store('ir_token');
    if (!LIVE && !saved && hh !== 'report' && hh !== 'login') {
      // โหมดตัวอย่าง: เปิดหน้าภาพรวมด้วยบัญชี QA ให้เห็นการทำงานทันที
      try { var demoLogin = Demo.login('qa', 'qa1234'); saved = demoLogin.token; store('ir_token', saved); } catch (e) { }
    }
    if (saved) { state.token = saved; start(hh && hh !== 'report' && hh !== 'login' ? hh : 'dash'); }
    else if (/^IR/.test(hh) || ['dash', 'list', 'settings'].indexOf(hh) >= 0) { state.after = hh; go('login'); }
    else go(hh === 'login' ? 'login' : 'report');
    call('config').then(function (cfg) {
      state.config = cfg; store('ir_config', JSON.stringify(cfg));
      if (!state.user && state.view === 'report' && !draft.type) { var b = qs('.brand-s'); if (b) b.textContent = cfg.orgName; go('report', null, true); }
    }).catch(function () { });
  }
  boot();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
</script>

</html>
